help:
  format: markdown
  content: |
    **HyphAeon bundle** -- collect per-orthogroup HyphAeon results and emit
    UCSC track BEDs plus the TACC comparative-genomics tarball (WF-GH). In
    v0 every alignment is analyzed whole and every collection element is
    keyed by the bare `{og}` identifier.

    Same logic as the classic `hyphaeon_bundle` tool -- the Python is inlined
    verbatim from `tools/hyphaeon_bundle/hyphaeon_bundle.py` by
    `scripts/build_selection_udts.py`, so the two cannot drift. Collection
    elements are staged from rendered collection JSON + identifier files
    (paired by position, count-asserted) because a job container cannot see a
    collection's element identifiers.

    Outputs: `selection_sites.bed` (BED9+7),
    `orthogroup.bed` (BED12), one AutoSql schema, per-OG summary and MultiQC
    tables, and `tacc_comparative_bundle.tar.gz`. Every BED is guaranteed
    non-empty so `bedToBigBed` never sees a 0-line input. All statistics are
    descriptive -- v0 ships no gene-level omnibus statistic and no
    `selection_genes` track.

    v0 scope: no recombination inputs exist -- the helper accepts none and
    emits no tract track. When upstream `rhizaeon partition` lands, a future
    version wires whatever contract it settles on.
