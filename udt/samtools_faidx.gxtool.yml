# ⛔ GENERATED by scripts/build_softmask_udts.py -- do not hand-edit.
# Edit the wrapper under tools/ (the awk/Python helpers are read from there) and regenerate.
class: GalaxyUserTool
id: brc-samtools-faidx
version: "0.2.0"
name: samtools faidx (BRC UDT)
description: Index a FASTA (.fai) and emit the chrom/length table bedtools wants as its genome file
container: quay.io/biocontainers/samtools:1.24--h9dcdb79_1
shell_command: |
  set -o pipefail
  { if gzip -t '$(inputs.input.path)' 2>/dev/null; then gzip -cd '$(inputs.input.path)'; else cat '$(inputs.input.path)'; fi; } \
    > seq.fa &&
  samtools faidx seq.fa &&
  cut -f1,2 seq.fa.fai > chrom.sizes &&
  awk '{ line = $0; sub(/\r$/, "", line) } line ~ /\r/ {
      print "⛔ brc-samtools-faidx: a carriage return appears MID-LINE, so this FASTA has lone-CR (classic Mac) or mixed line endings." > "/dev/stderr"
      print "   samtools splits records on a newline exactly as this awk does, so a > that follows a bare CR is invisible to BOTH: the record is swallowed into its predecessor, whose length then covers it, and the record-count guard below sees MATCHING counts and passes." > "/dev/stderr"
      print "   Measured: a 3-record FASTA came out as a 2-row index with the second contig reported 18 bp long when it is 8, and the third absent entirely, exit 0." > "/dev/stderr"
      print "   chrom.sizes is the bedtools genome file WF-C runs on -- an over-long contig lets intervals past its real end survive, and a missing one makes every interval on it vanish. REFUSING; convert the line endings first." > "/dev/stderr"
      exit 1 }' seq.fa &&
  awk '/^>/ {n++} END {print n+0}' seq.fa > n_seq.txt &&
  awk 'END {print NR+0}' seq.fa.fai > n_fai.txt &&
  awk 'NR == FNR {a = $1; next} {b = $1} END {
      if (a+0 == 0) {
          print "⛔ brc-samtools-faidx: the FASTA holds NO records at all." > "/dev/stderr"
          print "   The count guard below compares record counts, and 0 == 0 passes it, so this" > "/dev/stderr"
          print "   published a 0-byte chrom.sizes with exit 0. That is the bedtools genome file" > "/dev/stderr"
          print "   WF-C runs on, and an empty one makes EVERY interval vanish -- the maximal case" > "/dev/stderr"
          print "   of the loss the guard below exists to catch. REFUSING." > "/dev/stderr"
          exit 1
      }
      if (a+0 == b+0) exit 0
      print "⛔ brc-samtools-faidx: the FASTA holds " a " record(s) and the index " b " row(s)." > "/dev/stderr"
      print "   samtools drops a record in two cases and NEITHER of them changes the exit code:" > "/dev/stderr"
      print "   a DUPLICATE sequence name, which is warning-level only ([W::fai_insert_index]" > "/dev/stderr"
      print "   Ignoring duplicate sequence), and a ZERO-LENGTH record, which says nothing at all." > "/dev/stderr"
      print "   chrom.sizes is the bedtools genome file WF-C runs on, and a contig missing from a" > "/dev/stderr"
      print "   genome file makes every interval on it vanish silently. REFUSING rather than" > "/dev/stderr"
      print "   publishing a short index that looks complete." > "/dev/stderr"
      exit 1 }' n_seq.txt n_fai.txt
inputs:
  - name: input
    type: data
    format: fasta,fasta.gz
    label: FASTA to index
    help: >-
      Plain or gzipped. ⛔ samtools faidx CANNOT index ordinary gzip -- it accepts bgzip and
      nothing else -- so a .gz input is decompressed first rather than passed through. Handed one
      directly it fails with "Cannot index files compressed with gzip, please use bgzip", once per
      element, which is what WF-A did on an NCBI assembly collection: NCBI ships .gz, and unlike
      WF-B (where this step reads the already-decompressed output of brc-fasta-uppercase) WF-A
      indexes the raw assemblies.
outputs:
  - name: output
    type: data
    format: fai
    from_work_dir: seq.fa.fai
    label: FASTA index (.fai)
  - name: sizes
    type: data
    # ⚠ `len`, NOT `tabular`, AND THE POINT IS THE DIRECTION. `len` is chrominfo.ChromInfo, a
    # Tabular SUBCLASS, so it satisfies every `tabular` consumer -- measured: all nine
    # chrom-sizes inputs this pipeline reaches (bedtools sortbed/genomecoveragebed genome,
    # ucsc chainnet/chainprenet/axtomaf in_tar_ref_index and in_que_ref_index, liftoff
    # chrom_map) accept `tabular` or `txt`, and `len` satisfies all of them. `tabular` does NOT
    # satisfy a `len` input, and there is no converter, so the parent is the lossy choice: it
    # names less than is known and forecloses any consumer that asks for the real thing. The
    # label has always said "bedtools genome file"; this is that claim in a field a machine
    # reads. No tool installed on usegalaxy.org currently requires `len` without also accepting
    # `tabular` (checked across 96 bigbed/bigwig/ucsc/hub tools), so nothing is unblocked today
    # -- this is about not being the producer that publishes a parent type.
    format: len
    from_work_dir: chrom.sizes
    label: chrom/length table (bedtools genome file)
help:
  format: markdown
  content: |
    `faidx` is a SUBCOMMAND of samtools, not a separate program, so this wraps the samtools
    biocontainer and calls it.

    **Why this UDT exists at all.** `samtools_faidx` is published in the ToolShed but is NOT
    installed on usegalaxy.org -- a scan of all 2,370 tools in the panel returns no faidx of any
    kind, while twenty other samtools subcommands are present. `workflows/softmask` and
    `workflows/inventory` both reference `tool_id: samtools_faidx`, so both fail at invocation with
    "required tools are not installed" on that step.

    ⚠ **The copy is not redundant.** `samtools faidx` writes `<input>.fai` beside its input, and the
    Galaxy input path is read-only and outside the job's work dir, so indexing in place fails.

    The second output saves a step: the classic workflow ran `Cut c1,c2` over the `.fai` to build
    the bedtools genome file, which is exactly `chrom.sizes` here.
