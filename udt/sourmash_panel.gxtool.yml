# ⛔ GENERATED by scripts/build_inventory_udts.py -- do not hand-edit.
# The Python below is inlined VERBATIM from the wrapper's helper under tools/; edit it there and
# regenerate. Only the argument shape differs from the classic tool: the element identifiers arrive
# as a FILE (from the IUC collection_element_identifiers tool) rather than as a Cheetah-interpolated
# list, because a job container receives paths and never sees a collection's identifiers.
class: GalaxyUserTool
id: brc-sourmash-panel
version: "0.2.0"
name: sourmash sketch + compare over a panel (BRC UDT)
description: MinHash signatures for every assembly in a collection and the similarity matrix over them
container: quay.io/biocontainers/sourmash:4.9.4--hdfd78af_0
shell_command: |
  cat > rendered.txt <<'BRC_RENDERED'
  $(inputs.assemblies)
  BRC_RENDERED
  cat > sourmash_panel.py <<'BRC_PY'
  #!/usr/bin/env python3
  """Sketch every assembly in a collection, then compare -- labelling by element identifier.

  The identifiers cannot be read from the collection inside a job (see the module docstring of
  scripts/build_inventory_udts.py); they are supplied as a file, in collection order.
  """
  import argparse
  import json
  import pathlib
  import re
  import shutil
  import subprocess
  import sys

  ap = argparse.ArgumentParser()
  ap.add_argument("--rendered", required=True, help="file holding the rendered collection input")
  ap.add_argument("--ids", required=True, help="element identifiers, one per line, in collection order")
  ap.add_argument("--ksize", default="31")
  ap.add_argument("--scaled", default="1000")
  a = ap.parse_args()

  # ⛔ THE KEYS ARE QUOTED. Galaxy renders a collection input as JSON -- {"path": "/..."} -- not as a
  # JavaScript object literal, so a pattern written for a bare path key matches NOTHING and this
  # script reported "0 assemblies" against a perfectly good render: the heredoc held six well-formed
  # File records and every one was missed, which is why WF-A could never sketch anything. Parse it as
  # JSON, and fall back to the pattern only if that fails, so a future change in render shape
  # degrades loudly instead of silently finding zero.
  _raw = pathlib.Path(a.rendered).read_text()
  _json_ok = True
  try:
      _recs = json.loads(_raw[_raw.index("["):_raw.rindex("]") + 1])
      paths = [r["path"] for r in _recs if isinstance(r, dict) and r.get("path")]
  except Exception:                                   # noqa: BLE001 -- see below
      # ⚠ THE FALLBACK IS A DIAGNOSTIC, NOT A SECOND PARSER. Once it scraped even ONE path the
      # render fault below stopped firing and the count check took over -- so a render shaped
      # {"class":"File","path":...} instead of a list, which is exactly the "future change in render
      # shape" this fallback anticipates, was reported as "1 assemblies but 2 identifiers. The
      # identifier file must come from the SAME collection" and sent the operator to inspect the one
      # input that was correct. Remember that the JSON parse failed, and say so.
      _json_ok = False
      paths = re.findall(r'"?path"?\s*:\s*"?([^",}\s]+)', _raw)
  # ⚠ utf-8-SIG, NOT utf-8, and the same identifier checks the two sibling helpers already make.
  # A BOM survives `.strip()` and lands in the first name, so the matrix comes out labelled
  # `﻿cs10` -- which then joins against nothing in the self-pair or relabel files built from the
  # SAME file. Measured. A tab is rejected there and was accepted here; the CSV header took it.
  ids = [x.strip() for x in
         pathlib.Path(a.ids).read_text(encoding="utf-8-sig").splitlines() if x.strip()]
  _bad = [i for i in ids if "	" in i]
  if _bad:
      sys.exit(f"identifier(s) contain a tab, which lands in the similarity matrix header and breaks "
               f"every column contract downstream: {_bad[:3]}")

  # ⛔ THE ASSERTION IS THE POINT. Pairing by position is correct only while the two lists describe
  # the same collection; if they do not, every row of the matrix is mislabelled and nothing
  # downstream can tell. Refuse instead.
  # ⛔ DIAGNOSE THE RENDER BEFORE BLAMING THE IDENTIFIERS. This comparison used to run first, so an
  # unparseable or empty rendered block reported "0 assemblies but N identifiers -- the identifier file
  # must come from the SAME collection", pointing the operator at the one input that was correct. A
  # render this cannot read is a DIFFERENT fault and says so.
  # ⛔ AN EMPTY COLLECTION IS NOT A RENDER FAULT, AND SAYING SO SENT THE OPERATOR THE WRONG WAY.
  # These two states shared one message: an empty `assemblies` renders `[]`, json.loads SUCCEEDS,
  # paths is empty, and the operator was told "could not parse the rendered collection input as
  # JSON" -- asserting a parse failure that did not happen, about the one input that was fine. That
  # is the same misdirection this block was rewritten to remove; it just moved.
  if _json_ok and not paths:
      sys.exit("the collection input rendered cleanly and is EMPTY -- zero assemblies. Nothing to "
               "sketch, and a similarity matrix over nothing is not a result. Check the collection "
               "you passed as `assemblies`; the identifier file is not implicated.")
  if not _json_ok:
      sys.exit(f"could not parse the rendered collection input as JSON; the fallback pattern "
               f"scraped {len(paths)} path(s). That is a "
               "RENDER problem, not an identifier problem -- the identifier file is not implicated. "
               "The block should be a JSON array of File records; check what the tool actually "
               "received before changing anything about the identifiers.")
  # ⛔ DUPLICATE IDENTIFIERS SILENTLY DESTROY A ROW. Each signature is staged at `stage/{name}.sig`,
  # so two elements sharing a name overwrite one file -- and the count assertion below still passes,
  # because the COUNTS match. The result is a fully populated matrix in which one genome does not
  # appear and another appears twice, which is exactly the "runs and mislabels its output" failure
  # this script's assertions exist to prevent.
  if len(set(ids)) != len(ids):
      _dupes = sorted({i for i in ids if ids.count(i) > 1})
      sys.exit(f"duplicate element identifier(s) {_dupes[:3]}: a repeat would put two genomes in one "
               f"row of the matrix. Counts alone cannot detect this.")
  # ⚠ AND THESE NAMES ARE STILL REFUSED, THOUGH THE REASON HAS CHANGED. While signatures were staged
  # at `stage/{name}.sig` this was a data-loss guard: `gA` and `./gA` are distinct strings naming the
  # SAME file, so one sketch overwrote the other, the matrix came out `./gA,./gA` with an
  # off-diagonal 1.0 that is a self-comparison, and a genome was absent -- exit 0. `../escaped` wrote
  # the signature outside the job directory. Staging by INDEX (below) removed both hazards from the
  # SKETCH, and an earlier version of this comment concluded that what was left was only a cosmetic
  # label problem. That is no longer true in either half:
  #   * the name still travels into `--name` and becomes a COLUMN LABEL in similarity.csv, where a
  #     leading dash or an embedded path reads as a malformed strain and joins against nothing; and
  #   * the name is a FILENAME again -- `signatures/{name}.sig`, published as the discovered
  #     `signatures` collection at the end of this script. `gA` and `./gA` would collide there
  #     exactly as they once did in `stage/`, and `../escaped` would write outside the work dir.
  # So this guard is load-bearing for the data and not just for the labels; the count check beside
  # the publish step is the second line of defence.
  _bad = [i for i in ids if "/" in i or i in (".", "..") or i.startswith("-")]
  if _bad:
      sys.exit(f"element identifier(s) {_bad[:3]} contain a path separator, are a directory alias, or "
               f"begin with a dash. Galaxy allows them; this tool will not stage them, because such a "
               f"name can silently overwrite another element's signature or write outside the job.")
  if len(paths) != len(ids):
      sys.exit(f"refusing to guess: {len(paths)} assemblies but {len(ids)} identifiers. "
               f"The identifier file must come from the SAME collection, via the IUC "
               f"collection_element_identifiers tool.")
  subprocess.run(["mkdir", "-p", "stage"], check=True)
  for _i, (path, name) in enumerate(zip(paths, ids, strict=True)):
      sig = f"stage/{_i:04d}.sig"
      subprocess.run(["sourmash", "sketch", "dna", "-p", f"k={a.ksize},scaled={a.scaled}",
                      "--name", name, "-o", sig, path], check=True)
      # ⛔ AN EMPTY SKETCH IS INDISTINGUISHABLE FROM AN UNRELATED GENOME, AND sourmash SAYS NOTHING.
      # At --scaled 1000 a small enough sequence contributes NO hashes: measured, a 500 bp assembly
      # and 180 kb of N both sketched to 0 mins, and the similarity.csv that came out was
      # BYTE-IDENTICAL to the run where that element was a genuine 200 kb unrelated genome -- row
      # `0.0, 1.0, 0.0`, exit 0. So a panel member that failed upstream, or any small-genome member
      # (an organelle, a plasmid, an apicoplast), reads as "shares nothing with anyone" and this
      # matrix feeds WF-I's fold order. The count assertion above cannot see it; only the hashes can.
      _n = sum(len(s.get("mins") or []) for rec in json.loads(pathlib.Path(sig).read_text())
               for s in (rec.get("signatures") or []))
      # ⚠ AND THE BOUNDARY IS NOT ZERO. The harm this describes -- a row that reads "shares nothing
      # with anyone" -- is a property of a SMALL sketch, not of an empty one. Measured at
      # scaled=1000, k=31: a 360 nt viroid gives 1 hash, a 2 kb plasmid 3, a 5 kb virus 7, and each
      # of their similarity rows is BYTE-IDENTICAL to a genuinely unrelated 200 kb genome's. Worse,
      # a 30 kb truncation of a 3 Mb assembly -- 19 hashes, 100% contained in it -- scored 0.0064
      # against its own parent, indistinguishable from 0.0 in a heatmap and in WF-I's fold order.
      # Refusing at 0 and waving through 1 draws the line in the one place it does not belong.
      # ⚠ A CONSTANT, NOT A FUNCTION OF `--scaled`, AND THE OLD `max(20, scaled // 50)` HAD THE
      # RELATIONSHIP BACKWARDS. Hash count is INVERSELY proportional to --scaled, so raising it
      # lowers the hashes AND used to raise the bar: at --scaled 10000 the floor became 200 while a
      # 1 Mb assembly yields about 100 hashes, so a perfectly usable genome was reported as
      # unmeasured -- misfiring at exactly the operators who raised --scaled for a large panel.
      # Every measurement quoted above is an absolute count at scaled=1000, and none of them
      # justifies a scaling term.
      _floor = 20
      if _n == 0:
          sys.exit(f"{name} sketched to ZERO hashes at scaled={a.scaled}, so it can only appear in "
                   f"the matrix as a genome sharing nothing with anyone -- which is not a failure "
                   f"the run would otherwise report. Lower --scaled, or drop the element. ⚠ It is "
                   f"N-masking that empties a sketch, NOT soft-masking: a 200 kb genome in "
                   f"all-lowercase gives 195 hashes, measured.")
      if _n < _floor:
          print(f"⚠ {name} sketched only {_n} hash(es) at scaled={a.scaled} (floor {_floor}). Its "
                f"row will look like an unrelated genome's whatever it actually is -- a 5 kb genome "
                f"at 7 hashes is byte-identical in the matrix to something that shares nothing. "
                f"Treat its similarities as unmeasured, or lower --scaled for the whole panel.",
                file=sys.stderr)
      print(f"sketched {name} <- {path}  ({_n} hashes)", file=sys.stderr)

  sigs = [f"stage/{i:04d}.sig" for i in range(len(ids))]
  subprocess.run(["sourmash", "compare", "--ksize", a.ksize, "-o", "cmp", "--csv", "similarity.csv",
                  *sigs], check=True)
  subprocess.run(["sourmash", "plot", "--labels", "cmp"], check=True)

  # ---- publish the per-strain signatures ----------------------------------------------------------
  # ⛔ THE CLASSIC WORKFLOW PUBLISHES THESE AND THIS PORT DID NOT -- WF-A's one real parity loss.
  # `sourmash_sketch` mapped over the panel leaves one .sig dataset per strain, described in the
  # classic's own port list as "BRC-reusable"; collapsing sketch and compare into ONE job (which is
  # what the identifier assertion needs) turned them into work-dir files nobody could reach. A
  # discovered collection gives them back without splitting the job in two again.
  #
  # ⛔ AND THE FILENAME IS THE POINT, WHICH IS WHY THIS COPIES RATHER THAN DISCOVERING `stage/`.
  # Discovery takes each element identifier from the FILENAME, and `stage/` is deliberately keyed by
  # INDEX -- pointing discovery at it hands back a collection keyed `0000`..`000N`, which joins
  # against nothing downstream: not the sizes, not the self-pairs, not the relabel map, every one of
  # which keys on the strain. A collection whose identifiers are ordinals is worse than no collection
  # at all, because it looks like one.
  #
  # ⚠ SAFE ONLY BECAUSE OF THE IDENTIFIER GUARDS ABOVE, and this is now the second reason they exist:
  # a duplicate, a path separator, a dot-alias or a leading dash would collide here or write outside
  # the work dir, and all four are refused before anything is sketched.
  #
  # ⛔ THE INDEX PREFIX IS WHAT PUTS THIS COLLECTION IN PANEL ORDER, AND IT COSTS NOTHING. Discovery
  # sorts on the FULL filename (`sort_key: filename`) but takes the element identifier from the
  # `designation` REGEX GROUP -- so `0000_cs10.sig` sorts by its index while the element is still
  # called `cs10`. Every other WF-A output is in panel order (`sizes`, `busco_summaries` and
  # `fasta_index` are map-over collections; `self_pairs` and `relabel_map` are built line-per-strain
  # off the identifier list), so an alphabetical `signatures` was the odd one out.
  #
  # ⚠ AN EARLIER VERSION OF THIS COMMENT SAID PANEL ORDER "CANNOT BE MADE TO MATCH", and that was
  # wrong in a way worth recording: it is true only of the `sort_key` FIELD, whose every choice is
  # name-derived. The filenames are ours to pick, which settles it -- and the claim had already been
  # merged into two PRs before anyone tested the alternative. An impossibility claim needs a
  # measurement as much as a number does.
  #
  # ⚠ MEASURED ON usegalaxy.org 26.1, 2026-09-08 -- history bbd44e69cb8906b51601636ef7c09ef9. A panel
  # given as `cs10, PvP01, strain.2`, whose panel order and alphabetical order DIFFER (or the run
  # could not have told the two hypotheses apart), came back as a 3-element list keyed
  # `cs10, PvP01, strain.2` at indices 0,1,2 -- panel order, with the `0000_` prefix nowhere in the
  # identifiers. An earlier run without the prefix (history bbd44e69cb8906b54a726562e523b991) is where
  # the rest was measured and still holds: the declared `json` format is honoured, the elements are
  # hidden while the collection is visible, `strain.2` survives the pattern with its dot, and the
  # three sizes differ -- which is what says discovery found three files, not one file three times.
  pathlib.Path("signatures").mkdir(exist_ok=True)
  for _i, name in enumerate(ids):
      shutil.copyfile(f"stage/{_i:04d}.sig", f"signatures/{_i:04d}_{name}.sig")
  # ⛔ COUNT WHAT LANDED RATHER THAN ASSUMING IT. Discovery publishes whatever it finds, so a short
  # collection is a GREEN job with a genome missing -- the same silent loss the duplicate-identifier
  # guard exists to prevent, one step further down. If two names ever collapse onto one file by a
  # route those guards do not model (a case-insensitive filesystem, a future relaxation), this says so.
  _n_sigs = len(list(pathlib.Path("signatures").glob("*.sig")))
  if _n_sigs != len(ids):
      sys.exit(f"published {_n_sigs} signature file(s) for {len(ids)} strain(s): the discovered "
               f"`signatures` collection would be short a genome and the job would still succeed.")
  print(f"published {_n_sigs} signature(s) to signatures/", file=sys.stderr)
  BRC_PY
  python3 sourmash_panel.py --rendered rendered.txt --ids '$(inputs.identifiers.path)' --ksize '$(inputs.ksize)' --scaled '$(inputs.scaled)'
inputs:
  - name: assemblies
    type: data_collection
    collection_type: list
    # ⚠ RESTRICTED, AS THE CLASSIC AND BOTH SIBLING UDTs ARE. sourmash_sketch.xml declares
    # `format="fasta,fasta.gz"`, brc-samtools-faidx declares fasta,fasta.gz and brc-anchor-prep
    # gff3,gff3.gz; this input carried no `format:` at all, so a collection of any datatype was
    # selectable on the form and got sketched. It degrades loudly (the zero-hash guard fires)
    # rather than silently, but the port had dropped a validation for no stated reason.
    format: fasta,fasta.gz
    label: assemblies to sketch
    help: The panel. One signature per element, sketched in collection order.
  - name: identifiers
    type: data
    format: txt
    label: element identifiers of THAT collection, one per line
    help: >-
      From the IUC "Extract element identifiers" tool, run on the same collection. A job cannot read
      a collection's identifiers, and sourmash's matrix labels are the strain names, so they are
      supplied here and paired by position -- with the count asserted before anything is sketched.
  - name: ksize
    type: integer
    value: 31
    label: k-mer size
  - name: scaled
    type: integer
    value: 1000
    min: 1
    label: MinHash scaled factor (lower = finer, more hashes)
    help: >-
      ⛔ EXPOSED BECAUSE THE TOOL'S OWN ERROR MESSAGE TELLS YOU TO CHANGE IT. A sequence too small
      to contribute a hash at this resolution sketches to nothing, and its row in the similarity
      matrix is then byte-identical to a genome that shares nothing with anyone -- so the tool
      refuses rather than publish it. That refusal is fatal for the WHOLE panel (one job sketches
      every assembly), and until this input existed the remedy it names was unreachable: `--scaled`
      was an argparse default the tool form neither declared nor passed. Measured at scaled=1000,
      k=31: a 360 nt viroid gives 1 hash, a 2 kb plasmid 3, a 5 kb virus 7, a 16.6 kb mitochondrion
      14, a 200 kb genome 195. Lower this for a panel with small members; the default suits
      megabase assemblies.
outputs:
  - name: similarity
    type: data
    format: csv
    from_work_dir: similarity.csv
    label: sourmash similarity matrix (CSV, labelled by strain)
  - name: heatmap
    type: data
    format: png
    from_work_dir: cmp.matrix.png
    label: sourmash clustered heatmap
  - name: dendrogram
    type: data
    format: png
    from_work_dir: cmp.dendro.png
    label: sourmash dendrogram
  # ⛔ THE OUTPUT THAT CLOSES WF-A's ONE PARITY GAP. The classic workflow publishes one .sig dataset
  # per strain from `sourmash_sketch` mapped over the panel; this tool does the sketch INSIDE the
  # compare job, so without discovery the signatures stay work-dir files and the port silently
  # published less than the thing it ports.
  # ⚠ THE DIRECTORY IS `signatures/`, NOT `stage/`, AND THE `\d+_` IS LOAD-BEARING. `stage/` is
  # keyed by index alone, so discovering it would key the collection `0000`..`000N` instead of by
  # strain. The helper copies to `{index}_{strain}.sig`, which discovery sorts by FILENAME (giving
  # PANEL order, matching every other WF-A output) while taking the element identifier from the
  # `designation` group (giving the strain, with the index nowhere in it). Measured on .org 26.1.
  # ⚠ EVERY FIELD IS SPELLED OUT BECAUSE `UserToolSource` DEFAULTS NONE OF THEM -- a bare
  # `{pattern: ...}` entry fails validation.
  - name: signatures
    type: collection
    collection_type: list
    label: per-strain sourmash signatures (.sig)
    discover_datasets:
      - discover_via: pattern
        pattern: '\d+_(?P<designation>.+)\.sig'
        directory: signatures
        # ⛔ `sourmash.sig`, NOT `json`, AND THE DIFFERENCE IS ONE-DIRECTIONAL. Galaxy's registry
        # makes SourmashSignature a SUBCLASS of Json, so a `sourmash.sig` dataset satisfies any
        # `json` input -- but `json` does NOT satisfy a `sourmash.sig` input, and there is NO
        # CONVERTER either way. IUC's sourmash_compare declares `format="sourmash.sig"`, so
        # signatures published as `json` cannot be piped into it at all; the datatype has to be
        # changed by hand. This output exists to BE reusable, so it must be the datatype the
        # reusing tools ask for. Requires Galaxy >= 25.0, where the datatype landed.
        format: sourmash.sig
        visible: false
        recurse: false
        match_relative_path: false
        assign_primary_output: false
        sort_key: filename
        sort_comp: lexical
help:
  format: markdown
  content: |
    Both halves of the classic WF-A pair -- `sourmash_sketch` mapped over the panel and
    `sourmash_compare` over the resulting signatures -- in ONE job.

    ⚠ **That is not a shortcut, it is what the platform allows.** A user-defined tool cannot read a
    collection's element identifiers: measured on usegalaxy.org, `$(inputs.x)` renders File records
    whose `basename` is the DATASET name, with the identifiers nowhere in them. sourmash's matrix
    labels are the strain names, so the identifiers must be supplied alongside and paired by
    position — and pairing by position across two workflow steps would be a silent relabelling
    hazard. Sketching and comparing in one job keeps the pairing inside a single assertion.

    ⛔ **The assertion is the point.** If the identifier count and the assembly count disagree, the
    job REFUSES rather than sketching. A mismatched pair would produce a similarity matrix that is
    fully populated, plausible, and wrong about which strain each row is.

    The signature names are written by `sourmash sketch --name`, so the labels in the CSV come from
    the sketches themselves rather than from a post-hoc rename.

    **The per-strain signatures come back as a collection.** The classic WF-A pair published one
    `.sig` dataset per strain — "BRC-reusable" — and doing the sketch inside this job made them
    work-dir files instead. They are copied to `signatures/{index}_{strain}.sig` after the compare and
    published as a discovered `list` collection, keyed by strain, so nothing about WF-A's output
    set is lost by collapsing the two steps.

    ⚠ **They are in PANEL order, like everything else WF-A publishes**, and that takes an index
    prefix to arrange. Discovery sorts on the FULL filename but names each element from the
    `designation` group, so the files are copied out as `{index}_{strain}.sig`: the index orders
    the collection, the group keys it, and the index appears nowhere in the identifiers. Without the
    prefix the only orders available are name-derived, which would leave `signatures` alphabetical
    while `sizes`, `busco_summaries`, `fasta_index`, `self_pairs` and `relabel_map` are all in panel
    order — one workflow, two orders, which is the shape of the WF-C2 mis-pairing incident.

    **Measured, not inferred** — usegalaxy.org 26.1, 2026-09-08, history
    `bbd44e69cb8906b51601636ef7c09ef9`. A three-element panel given in the order
    `cs10, PvP01, strain.2` — chosen so panel order and alphabetical order DIFFER, or the run could
    not have told the two apart — came back as:

    ```
    collection_type=list  element_count=3
      0  cs10       ext=json   38783 bytes  visible=False
      1  PvP01      ext=json   39038 bytes  visible=False
      2  strain.2   ext=json   37992 bytes  visible=False
    ```

    ⚠ THAT RUN PREDATES THE `sourmash.sig` CHANGE and the `ext=json` above is left as it was
    OBSERVED rather than edited to match the current declaration -- a measurement rewritten to
    agree with later code is no longer a measurement. What it establishes is unaffected: the
    ordering and the keying, neither of which depends on which datatype is named.

    **The datatype itself was then measured separately** -- usegalaxy.org, 2026-09-09, history
    `bbd44e69cb8906b5782410311f1ad341`, this tool at v0.2.0 over a two-element panel:

    ```
    per-strain sourmash signatures (.sig): 2 element(s)
      gA  extension='sourmash.sig'  peek='Sourmash signature file'
      gB  extension='sourmash.sig'  peek='Sourmash signature file'
    ```

    Three things at once: the server ACCEPTS `format: sourmash.sig` in a UDT `discover_datasets`
    block at registration, discovery HONOURS it, and the peek string is `SourmashSignature`'s own
    `set_peek` output, so the datasets carry that class and not merely that label.

    So: panel order, keyed by strain with the `0000_` prefix nowhere in the identifiers,
    the declared `format:` honoured, the elements hidden while the collection itself is visible
    (`visible: false` applies to the elements), and three distinct sizes rather than one file found
    three times. An earlier run without the prefix
    (`bbd44e69cb8906b54a726562e523b991`) returned the same three elements alphabetically, and is
    where the dot in `strain.2` was shown to survive the pattern intact.
