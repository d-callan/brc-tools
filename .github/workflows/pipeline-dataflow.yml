name: pipeline-dataflow

# Keep the generated pages under workflows/ in sync with what they are generated FROM:
#
#   pipeline_dataflow.html  <- gen_pipeline_dataflow.py + the workflow files
#   pipeline_io_map.html    <- gen_pipeline_io_map.py   + the workflow files
#                              + workflow_descriptions.md + examples/wf_*_examples.json
#
# ⛔ THE SECOND PAGE WAS UNGATED FOR AS LONG AS IT HAS EXISTED, AND IT DRIFTED. Only the
# dataflow page was verified here; pipeline_io_map.html is regenerated by pages.yml at
# deploy time, so the PUBLISHED site was always right and the COMMITTED copy was free to
# rot. #37 (2026-09-04) edited inventory.gxwf.yml's `busco_lineage` doc, which the io_map
# embeds and the dataflow page does not, and passed this job green; main then carried a
# stale io_map for four days until #46 happened to touch a doc BOTH pages embed and
# inherited the catch-up in its diff.
#
# ⛔ THE FILENAME AND THE JOB NAME ARE DELIBERATELY UNCHANGED. A required-status-check
# context is keyed on the JOB name, so renaming `regenerate` -- or this file, which is
# where a reader would look for the scope -- can silently stop satisfying a branch
# protection rule that names it, and nothing would report that. The scope is documented
# here instead; renaming belongs with whoever can see the protection settings.
#
# ⚠ THE TRIGGER PATHS ARE THE OTHER HALF OF THE GATE, and they were incomplete in a way
# that a second verify step alone would not have fixed: `workflow_descriptions.md` and
# `examples/*.json` are inputs to the io_map and appeared in NO filter, so editing either
# ran this job not at all. Measured on 2026-09-08 -- a one-word change to each rewrites
# pipeline_io_map.html and leaves pipeline_dataflow.html byte-identical.
#
# The generated HTML is never itself a trigger, so this cannot loop.
on:
  push:
    branches: [main]
    paths:
      - 'workflows/**/*.gxwf.yml'
      - 'workflows/**/*.ga'
      - 'workflows/workflow_descriptions.md'
      - 'workflows/examples/*.json'
      - 'workflows/gen_pipeline_dataflow.py'
      - 'workflows/gen_pipeline_io_map.py'
      # ⚠ AND THIS FILE. A change to the gate that does not run the gate proves nothing --
      # the PR that added the io_map half touched only this file, so without this line its
      # own job would not have been scheduled and it would have merged untested.
      - '.github/workflows/pipeline-dataflow.yml'
  pull_request:
    # ⛔ THE SAME LIST, AND IT HAS TO BE. GitHub does not let one path filter serve both
    # events, and a filter that drifts from its twin gates pushes to main without gating
    # the PRs that make them -- which is the failure this whole file is about. Change both.
    paths:
      - 'workflows/**/*.gxwf.yml'
      - 'workflows/**/*.ga'
      - 'workflows/workflow_descriptions.md'
      - 'workflows/examples/*.json'
      - 'workflows/gen_pipeline_dataflow.py'
      - 'workflows/gen_pipeline_io_map.py'
      - '.github/workflows/pipeline-dataflow.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      # Regenerate BOTH. Either generator exits non-zero on an inconsistency it can see --
      # a curated EDGES entry naming a port that no longer exists, or a workflow in VETTED
      # with no '### summary'/'### description' in workflow_descriptions.md -> this step
      # fails and names what to fix.
      - name: Regenerate the pipeline pages
        run: |
          python workflows/gen_pipeline_dataflow.py
          python workflows/gen_pipeline_io_map.py

      # On a PR: gate. Fail if either committed page is stale (didn't include a regen).
      - name: Verify the pipeline pages are up to date (PR)
        if: github.event_name == 'pull_request'
        run: |
          stale=0
          for page in pipeline_dataflow.html pipeline_io_map.html; do
            gen="workflows/gen_${page%.html}.py"
            if git diff --quiet -- "workflows/$page"; then
              echo "$page is up to date."
              continue
            fi
            echo "::error::workflows/$page is out of date. Run 'python $gen' and commit the result."
            # ⚠ NOT `git diff | head -40`. Both pages are a SINGLE LINE of HTML, so a
            # line-limited diff prints the entire file -- 44 kB for the dataflow page and
            # about 1 MB for the io_map, which is how this job's log reached 32 kB while
            # saying nothing a reader could use. A porcelain word-diff puts one changed
            # WORD per line, so 40 lines is 40 words of actual change.
            git --no-pager diff --word-diff=porcelain -U0 -- "workflows/$page" \
              | grep -E '^[-+][^-+]' | head -40 || true
            stale=1
          done
          exit $stale

      # On push to main: auto-commit whichever page changed.
      # (Pushes made with GITHUB_TOKEN do not re-trigger workflows, so no loop.)
      - name: Commit the refreshed pages (push)
        if: github.event_name == 'push'
        run: |
          pages="workflows/pipeline_dataflow.html workflows/pipeline_io_map.html"
          if git diff --quiet -- $pages; then
            echo "both pipeline pages already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $pages
          git commit -m "CI: regenerate the pipeline pages [skip ci]"
          git push
